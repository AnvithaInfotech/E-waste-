{% if messages %}
    <div class="row">
        <div class="col-12">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm rounded-3 d-flex align-items-center gap-2 mb-3" role="alert">
                    {% if message.tags == 'success' %}
                        <i class="bi bi-check-circle-fill fs-5 text-success"></i>
                    {% elif message.tags == 'danger' or message.tags == 'error' %}
                        <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
                    {% elif message.tags == 'warning' %}
                        <i class="bi bi-exclamation-diamond-fill fs-5 text-warning"></i>
                    {% else %}
                        <i class="bi bi-info-circle-fill fs-5 text-info"></i>
                    {% endif %}
                    <div class="flex-grow-1">{{ message }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    </div>
{% endif %}
